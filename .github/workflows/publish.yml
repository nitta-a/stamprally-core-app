name: Publish packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm and GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Check tag matches package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm release:check "${RELEASE_TAG}"

      - name: Publish packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          for package_name in @stamprally/core @stamprally/react; do
            if npm view "${package_name}@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "${package_name}@${version} is already published; skipping."
              continue
            fi

            pnpm --filter "${package_name}" publish \
              --access public \
              --provenance \
              --no-git-checks
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "GitHub release ${{ github.ref_name }} already exists; skipping."
          else
            gh release create "${{ github.ref_name }}" \
              --verify-tag \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
