name: Publish packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm and GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Check tag matches package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const tagVersion = process.env.RELEASE_TAG.replace(/^v/, "");
          const packageFiles = [
            "packages/core/package.json",
            "packages/react/package.json",
          ];

          for (const packageFile of packageFiles) {
            const packageJson = JSON.parse(readFileSync(packageFile, "utf8"));
            if (packageJson.version !== tagVersion) {
              throw new Error(
                `${packageFile} is ${packageJson.version}, but the release tag is v${tagVersion}`,
              );
            }
          }
          NODE

      - name: Publish packages to npm
        run: pnpm publish --recursive --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
